<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Demeter">
  <!--
    Demeter logo: a water droplet whose body is a leaf.
    Palette borrowed from src/index.css:
      dust-grey   #dad7cd
      dry-sage    #a3b18a
      fern        #588157
      hunter-green#3a5a40
      pine-teal   #344e41
  -->
  <defs>
    <linearGradient id="droplet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3b18a" />
      <stop offset="55%" stop-color="#588157" />
      <stop offset="100%" stop-color="#344e41" />
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0e6" />
      <stop offset="100%" stop-color="#dad7cd" />
    </linearGradient>
  </defs>

  <!-- Droplet silhouette = leaf body -->
  <path
    d="M32 3 C32 3 11 27 11 42 C11 53.5 20.5 61 32 61 C43.5 61 53 53.5 53 42 C53 27 32 3 32 3 Z"
    fill="url(#droplet)" />

  <!-- Leaf midrib, following the droplet's vertical axis -->
  <path
    d="M32 11 C31.2 24 31.2 38 32 56"
    fill="none" stroke="url(#vein)" stroke-width="2.2"
    stroke-linecap="round" />

  <!-- Paired side veins, fanning out like a leaf -->
  <g fill="none" stroke="url(#vein)" stroke-width="1.6" stroke-linecap="round" opacity="0.95">
    <path d="M32 22 C27 23 22 26 19 31" />
    <path d="M32 22 C37 23 42 26 45 31" />
    <path d="M32 33 C26 34 21 37 18 43" />
    <path d="M32 33 C38 34 43 37 46 43" />
    <path d="M32 44 C28 45 25 47 23 51" />
    <path d="M32 44 C36 45 39 47 41 51" />
  </g>

  <!-- Subtle highlight to read as water -->
  <path
    d="M24 30 C21 35 20 40 21 44"
    fill="none" stroke="#ffffff" stroke-width="2"
    stroke-linecap="round" opacity="0.35" />
</svg>