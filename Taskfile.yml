# https://taskfile.dev

version: "3"

tasks:
    sqlc:
        cmds:
            - sqlc generate
    site:
        dir: docs
        cmds:
            - npm run dev
    build:
        deps:
            - embed
        cmds:
            - go build ./cmd/demeter
    embed:
        deps:
            - ui:build
        cmds:
            - cp ./sql/schema.sql ./internal/embedded/schema.sql
            - rm -rf ./internal/embedded/ui
            - cp -r ./web/build ./internal/embedded/ui

includes:
    ui:
        dir: web
        taskfile: ./web
    dev:
        taskfile: ./dev
        dir: ./dev
    esp:
        taskfile: ./esp-sensor
        dir: ./esp-sensor
    docs:
        dir: ./docs
        taskfile: ./docs
