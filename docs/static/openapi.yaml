openapi: 3.0.3
info:
  title: Demeter API
  version: 1.0.0
  description: |
    HTTP API for the Demeter hydroponics/enclosure management service.

    # A note on nullable fields

    The persistence layer uses SQLite `NULL`-able columns surfaced through
    Go's `database/sql` `Null*` wrapper types (`sql.NullTime`,
    `sql.NullString`, `sql.NullInt64`). When serialized with the default
    `encoding/json` marshaller these fields are emitted as objects of the
    shape `{"Time": "...", "Valid": true}` / `{"String": "...", "Valid": true}`
    / `{"Int64": 0, "Valid": false}` rather than plain nullable scalars.

    The schemas below model them as plain nullable properties for readability.
    Clients should be prepared for the actual wrapper-object shape unless a
    custom marshaller is added later.
  contact:
    name: Demeter
    url: https://github.com/SethCurry/demeter
servers:
  - url: /
    description: Local server
tags:
  - name: Enclosures
  - name: Systems
  - name: Flows
  - name: PlantSites
  - name: Plants
  - name: PlantGenera
  - name: PlantSpecies
  - name: Notes
  - name: Metrics
  - name: Timelapse
  - name: Sensors

paths:
  # ---------------------------------------------------------------- sensors
  /api/websocket/sensors:
    get:
      tags: [Sensors]
      summary: Sensor WebSocket endpoint
      description: |
        Upgrades the HTTP request to a WebSocket connection. Sensor readings
        pushed by devices are received and persisted. Not a normal REST
        endpoint; documented for completeness.
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)
        "500":
          $ref: "#/components/responses/InternalError"

  # ------------------------------------------------------------- enclosures
  /api/enclosures:
    get:
      tags: [Enclosures]
      summary: List enclosures
      responses:
        "200":
          description: Enclosure list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Enclosure" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Enclosures]
      summary: Create an enclosure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnclosureRequest" }
      responses:
        "201":
          description: Created enclosure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enclosure" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Enclosure name already exists
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/enclosures/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Enclosures]
      summary: Get an enclosure
      responses:
        "200":
          description: Enclosure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enclosure" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Enclosure not found
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Enclosures]
      summary: Update an enclosure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnclosureRequest" }
      responses:
        "200":
          description: Updated enclosure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enclosure" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Enclosure not found
          content: { $ref: "#/components/responses/ErrorContent" }
        "409":
          description: Enclosure name already exists
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Enclosures]
      summary: Delete an enclosure
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/enclosures/{id}/plants:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Enclosures, Plants]
      summary: List plants in an enclosure
      responses:
        "200":
          description: Plants belonging to the enclosure
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/enclosures/{id}/air-temperature:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/LimitQuery" }]
    get:
      tags: [Enclosures, Metrics]
      summary: List raw air-temperature readings for an enclosure
      responses:
        "200":
          description: Raw readings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnclosureAirTemperature" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/enclosures/{id}/air-humidity:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/LimitQuery" }]
    get:
      tags: [Enclosures, Metrics]
      summary: List raw air-humidity readings for an enclosure
      responses:
        "200":
          description: Raw readings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnclosureAirHumidity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/enclosures/{id}/metrics/air-temperature:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/MetricStart" }
      - { $ref: "#/components/parameters/MetricEnd" }
      - { $ref: "#/components/parameters/MetricLimit" }
    get:
      tags: [Enclosures, Metrics]
      summary: Air-temperature metric series (interval-averaged)
      responses:
        "200":
          description: Averaged metric series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetricResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/enclosures/{id}/metrics/air-humidity:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/MetricStart" }
      - { $ref: "#/components/parameters/MetricEnd" }
      - { $ref: "#/components/parameters/MetricLimit" }
    get:
      tags: [Enclosures, Metrics]
      summary: Air-humidity metric series (interval-averaged)
      responses:
        "200":
          description: Averaged metric series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetricResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------- systems
  /api/systems:
    get:
      tags: [Systems]
      summary: List systems
      parameters:
        - name: enclosure_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: When set, only systems belonging to this enclosure are returned.
      responses:
        "200":
          description: System list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/System" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Systems]
      summary: Create a system
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemRequest" }
      responses:
        "201":
          description: Created system
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: System name already exists or enclosure does not exist
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/systems/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Systems]
      summary: Get a system
      responses:
        "200":
          description: System
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: System not found
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Systems]
      summary: Update a system
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemRequest" }
      responses:
        "200":
          description: Updated system
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: System not found
          content: { $ref: "#/components/responses/ErrorContent" }
        "409":
          description: System name already exists or enclosure does not exist
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Systems]
      summary: Delete a system
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/systems/{id}/ph:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/LimitQuery" }]
    get:
      tags: [Systems, Metrics]
      summary: List raw pH readings for a system
      responses:
        "200":
          description: Raw readings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SystemPh" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/systems/{id}/ec:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/LimitQuery" }]
    get:
      tags: [Systems, Metrics]
      summary: List raw EC readings for a system
      responses:
        "200":
          description: Raw readings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SystemEc" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/systems/{id}/water-temperature:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/LimitQuery" }]
    get:
      tags: [Systems, Metrics]
      summary: List raw water-temperature readings for a system
      responses:
        "200":
          description: Raw readings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SystemWaterTemperature" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/systems/{id}/metrics/ph:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/MetricStart" }
      - { $ref: "#/components/parameters/MetricEnd" }
      - { $ref: "#/components/parameters/MetricLimit" }
    get:
      tags: [Systems, Metrics]
      summary: pH metric series (interval-averaged)
      responses:
        "200":
          description: Averaged metric series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetricResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/systems/{id}/metrics/ec:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/MetricStart" }
      - { $ref: "#/components/parameters/MetricEnd" }
      - { $ref: "#/components/parameters/MetricLimit" }
    get:
      tags: [Systems, Metrics]
      summary: EC metric series (interval-averaged)
      responses:
        "200":
          description: Averaged metric series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetricResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/systems/{id}/metrics/water-temperature:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/MetricStart" }
      - { $ref: "#/components/parameters/MetricEnd" }
      - { $ref: "#/components/parameters/MetricLimit" }
    get:
      tags: [Systems, Metrics]
      summary: Water-temperature metric series (interval-averaged)
      responses:
        "200":
          description: Averaged metric series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetricResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ------------------------------------------------------------------ flows
  /api/flows:
    get:
      tags: [Flows]
      summary: List flows
      description: |
        Returns all flows, or flows filtered by `system_id`, or child flows of
        `parent_flow_id`. `system_id` takes precedence over `parent_flow_id`
        when both are supplied.
      parameters:
        - name: system_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: parent_flow_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Flow list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Flow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Flows]
      summary: Create a flow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlowRequest" }
      responses:
        "201":
          description: Created flow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Flow name already exists or referenced system/parent flow does not exist
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/flows/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Flows]
      summary: Get a flow
      responses:
        "200":
          description: Flow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Flow not found
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Flows]
      summary: Update a flow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlowRequest" }
      responses:
        "200":
          description: Updated flow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Flow not found
          content: { $ref: "#/components/responses/ErrorContent" }
        "409":
          description: Flow name already exists or referenced system/parent flow does not exist
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Flows]
      summary: Delete a flow
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/flows/{id}/plants:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Flows, Plants]
      summary: List plants attached to a flow's plant sites
      responses:
        "200":
          description: Plants belonging to the flow
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ------------------------------------------------------------ plant sites
  /api/plant-sites:
    get:
      tags: [PlantSites]
      summary: List plant sites
      parameters:
        - name: flow_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: When set, only sites belonging to this flow are returned.
      responses:
        "200":
          description: Plant site list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlantSite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [PlantSites]
      summary: Create a plant site
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlantSiteRequest" }
      responses:
        "201":
          description: Created plant site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantSite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Referenced flow does not exist
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/plant-sites/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [PlantSites]
      summary: Get a plant site
      responses:
        "200":
          description: Plant site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantSite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Plant site not found
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [PlantSites]
      summary: Update a plant site
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlantSiteRequest" }
      responses:
        "200":
          description: Updated plant site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantSite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Plant site not found
          content: { $ref: "#/components/responses/ErrorContent" }
        "409":
          description: Referenced flow does not exist
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [PlantSites]
      summary: Delete a plant site
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/plant-sites/{id}/lux:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [PlantSites, Metrics]
      summary: List raw lux readings for a plant site
      responses:
        "200":
          description: Raw readings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlantSiteLux" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/plant-sites/{id}/metrics/lux:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/MetricStart" }
      - { $ref: "#/components/parameters/MetricEnd" }
      - { $ref: "#/components/parameters/MetricLimit" }
    get:
      tags: [PlantSites, Metrics]
      summary: Lux metric series (interval-averaged)
      responses:
        "200":
          description: Averaged metric series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetricResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ----------------------------------------------------------------- plants
  /api/plants:
    get:
      tags: [Plants]
      summary: List plants
      description: |
        Returns all plants, or plants filtered by `plant_site_id`, or plants
        of a given `species_id`. `plant_site_id` takes precedence over
        `species_id` when both are supplied.
      parameters:
        - name: plant_site_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: species_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Plant list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Plants]
      summary: Create a plant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlantRequest" }
      responses:
        "201":
          description: Created plant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Referenced plant site or species does not exist
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/plants/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Plants]
      summary: Get a plant
      responses:
        "200":
          description: Plant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Plant not found
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Plants]
      summary: Update a plant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlantRequest" }
      responses:
        "200":
          description: Updated plant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Plant not found
          content: { $ref: "#/components/responses/ErrorContent" }
        "409":
          description: Referenced plant site or species does not exist
          content: { $ref: "#/components/responses/ErrorContent" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Plants]
      summary: Delete a plant
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------- plant genera
  /api/plant-genera:
    get:
      tags: [PlantGenera]
      summary: List plant genera
      responses:
        "200":
          description: Plant genus list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlantGenus" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [PlantGenera]
      summary: Create a plant genus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlantGenusRequest" }
      responses:
        "201":
          description: Created plant genus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantGenus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
