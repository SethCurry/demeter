  # ------------------------------------------------------------- timelapse
  /api/timelapse:
    get:
      tags: [Timelapse]
      summary: List available timelapse recordings
      description: |
        Lists the subdirectories under the configured timelapse root. Each
        directory is named after a device MAC address and represents one
        timelapse stream.
      responses:
        "200":
          description: Timelapse directory list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimelapseResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/timelapse/{mac}/timelapse.mjpeg:
    parameters:
      - name: mac
        in: path
        required: true
        schema: { type: string }
        description: Device MAC address identifying the timelapse directory.
    get:
      tags: [Timelapse]
      summary: Stream a timelapse as MJPEG
      description: |
        Streams a Motion-JPEG feed assembled from the `.jpeg` frames stored
        under the device's timelapse directory. Frames are vertically flipped
        before being sent. The response is a streaming `multipart/x-mixed-replace`
        MJPEG stream, not a single JSON document.
      responses:
        "200":
          description: MJPEG stream
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        "500": { $ref: "#/components/responses/InternalError" }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Numeric resource identifier.
    LimitQuery:
      name: limit
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
      description: |
        Maximum number of raw readings to return. Defaults to 100; non-positive
        values fall back to the default.
    MetricStart:
      name: start
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: |
        Window start (RFC3339). Defaults to 24 hours before `end`.
    MetricEnd:
      name: end
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: Window end (RFC3339). Defaults to the current time.
    MetricLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
      description: |
        Number of equal-length intervals to bucket the window into. Defaults
        to 24. Each returned point is the average of the readings in its
        interval.

  responses:
    BadRequest:
      description: Malformed request (invalid id, bad query, or invalid JSON body).
      content: { $ref: "#/components/responses/ErrorContent" }
    InternalError:
      description: Unexpected server error.
      content: { $ref: "#/components/responses/ErrorContent" }
    ErrorContent:
      description: Error response body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ---- entity schemas -------------------------------------------------
    Enclosure:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
      required: [ID, Name]

    EnclosureRequest:
      type: object
      properties:
        name: { type: string }
      required: [name]

    System:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        EnclosureID: { type: integer, format: int64 }
      required: [ID, Name, EnclosureID]

    SystemRequest:
      type: object
      properties:
        name: { type: string }
        enclosure_id: { type: integer, format: int64 }
      required: [name, enclosure_id]

    Flow:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        SystemID: { type: integer, format: int64 }
        ParentFlowID:
          nullable: true
          oneOf:
            - { type: integer, format: int64 }
            - { type: "null" }
      required: [ID, Name, SystemID, ParentFlowID]

    FlowRequest:
      type: object
      properties:
        name: { type: string }
        system_id: { type: integer, format: int64 }
        parent_flow_id:
          nullable: true
          oneOf:
            - { type: integer, format: int64 }
            - { type: "null" }
      required: [name, system_id]

    PlantSite:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        FlowID: { type: integer, format: int64 }
        X: { type: integer, format: int64 }
        Y: { type: integer, format: int64 }
        Z: { type: integer, format: int64 }
      required: [ID, FlowID, X, Y, Z]

    PlantSiteRequest:
      type: object
      properties:
        flow_id: { type: integer, format: int64 }
        x: { type: integer, format: int64 }
        y: { type: integer, format: int64 }
        z: { type: integer, format: int64 }
      required: [flow_id, x, y, z]

    Plant:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        PlantSiteID: { type: integer, format: int64 }
        PlantedOn:
          nullable: true
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        SpeciesID:
          nullable: true
          oneOf:
            - { type: integer, format: int64 }
            - { type: "null" }
      required: [ID, PlantSiteID, PlantedOn, SpeciesID]

    PlantRequest:
      type: object
      properties:
        plant_site_id: { type: integer, format: int64 }
        planted_on:
          nullable: true
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        species_id:
          nullable: true
          oneOf:
            - { type: integer, format: int64 }
            - { type: "null" }
      required: [plant_site_id]

    PlantGenus:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
      required: [ID, Name]

    PlantGenusRequest:
      type: object
      properties:
        name: { type: string }
      required: [name]

    PlantSpecies:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Name: { type: string }
        PlantGenusID:
          nullable: true
          oneOf:
            - { type: integer, format: int64 }
            - { type: "null" }
      required: [ID, Name, PlantGenusID]

    PlantSpeciesRequest:
      type: object
      properties:
        name: { type: string }
        plant_genus_id:
          nullable: true
          oneOf:
            - { type: integer, format: int64 }
            - { type: "null" }
      required: [name]

    # ---- notes ----------------------------------------------------------
    SimpleNote:
      description: |
        Shape shared by enclosure, system, and flow notes: an id, a nullable
        timestamp, and nullable content text. These tables have no foreign key
        to their nominal parent.
      type: object
      properties:
        ID: { type: integer, format: int64 }
        Timestamp:
          nullable: true
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        Content:
          nullable: true
          oneOf:
            - { type: string }
            - { type: "null" }
      required: [ID, Timestamp, Content]

    SimpleNoteRequest:
      type: object
      properties:
        content:
          nullable: true
          oneOf:
            - { type: string }
            - { type: "null" }
        timestamp:
          nullable: true
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }

    PlantSiteNote:
      type: object
      properties:
        ID: { type: integer, format: int64 }
        PlantSiteID: { type: integer, format: int64 }
        Timestamp: { type: string, format: date-time }
        Content:
          nullable: true
          oneOf:
            - { type: string }
            - { type: "null" }
      required: [ID, PlantSiteID, Timestamp, Content]

    PlantSiteNoteRequest:
      type: object
      properties:
        plant_site_id: { type: integer, format: int64 }
        content:
          nullable: true
          oneOf:
            - { type: string }
            - { type: "null" }
        timestamp:
          nullable: true
